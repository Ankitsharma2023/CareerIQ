name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes the run in flight for the same branch. Without this,
# pushing three times in a row queues three full runs and you wait for the
# oldest one to tell you about code you have already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Two reasons this is set explicitly rather than left to the default.
      # One: it gives actions/cache a stable path to restore into, so the 65MB
      # embedding model is fetched once rather than on every run — the suite
      # calls calculate_similarity for real, so it does load the model.
      # Two: tests/test_config_loading.py asserts the cache never lands in a
      # temp directory, because fastembed's default does exactly that and
      # Windows then clears it. A path under the workspace satisfies both.
      MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.model-cache
          # Keyed on the model name, so swapping models invalidates it and
          # nothing else does.
          key: fastembed-bge-small-en-v1.5

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml --extra dev

      - name: Lint
        run: ruff check .

      # No OPENROUTER_API_KEY is provided on purpose. The suite must pass
      # without one: every LLM test stubs the transport, and the deterministic
      # analysis pipeline is required to work with no LLM configured at all. A
      # test that quietly needs a live key is a test that will fail on a fork.
      - name: Tests
        run: pytest -q

  frontend:
    name: frontend (types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly what package-lock.json pins and
      # fails loudly when the lockfile is out of step with package.json, which
      # is the failure worth catching here.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  evaluation:
    name: evaluation gate (metrics must not drop)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same reasoning as the backend job: a stable cache path for the 65MB
    # embedding model, and one that is not a temp directory.
    env:
      MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.model-cache
          key: fastembed-bge-small-en-v1.5

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml --extra dev

      # Compares the harness output against evals/baseline.json and fails on a
      # drop beyond the per-metric tolerance, or a breach of an absolute floor
      # or ceiling. A change that is meant to move these numbers re-cuts the
      # baseline with `python evals/gate.py --update` in the same commit, which
      # makes the movement reviewable in the diff instead of invisible.
      #
      # Verified to fail rather than merely exist: setting the component
      # weights to [0.95, 0.00, 0.05] drops nDCG@5 to 0.9760 and pushes the
      # equivalence gap to 5.74, and the gate reports all four violations.
      - name: Evaluation gate
        run: python evals/gate.py

      # The invariance properties: concealed text changes nothing, abbreviating
      # a tool name costs less than the gate, and moving a skill into an
      # experience bullet never lowers the score. Run separately from the
      # backend suite so a failure here reads as "a guarantee broke" rather
      # than "a test broke".
      - name: Invariance properties
        run: pytest -q tests/test_invariance.py
